name: Portfolio CI and deployment

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, portfolio-teaching-refresh]
  workflow_dispatch:
  schedule:
    # Refresh the copyright in the static HTML for readers with JavaScript disabled.
    - cron: '7 0 1 1 *'

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Package the tested site, including the Apache configuration
        if: github.ref == 'refs/heads/master'
        run: tar -czf "$RUNNER_TEMP/portfolio.tar.gz" -C dist .
      - name: Save the production build
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: portfolio-site
          path: ${{ runner.temp }}/portfolio.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Publish to IONOS
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: SFTPIonosTonyAielloio
      url: https://tony.aiello.io
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Confirm this revision is still on master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_master=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')
          if [[ "$current_master" != "$GITHUB_SHA" ]]; then
            echo "::error::A newer commit is on master. Run the workflow on the current master to publish."
            exit 1
          fi
      - name: Download the tested build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: portfolio-site
          path: ${{ runner.temp }}/portfolio-build
      - name: Prepare the upload
        run: |
          mkdir dist
          tar -xzf "$RUNNER_TEMP/portfolio-build/portfolio.tar.gz" -C dist
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lftp
      - name: Upload and verify tony.aiello.io
        env:
          IONOS_SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
          IONOS_SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
          IONOS_SFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
        run: bash scripts/deploy-ionos.sh
