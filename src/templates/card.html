<% const image = project.images[0]; const site = websiteFor(project, image) %>
<article class="work-card<%= image ? '' : ' text-card' %>">
  <% if (image) { %>
  <a class="card-visual art-<%= project.slug %>" href="<%= site.url %>" target="_blank" rel="noopener noreferrer" aria-label="<%= project.title %>. <%= site.label %> (opens in a new tab)">
    <img src="/media/<%= image.file %>" width="<%= image.width %>" height="<%= image.height %>" alt="<%= image.alt %>" loading="lazy" decoding="async">
  </a>
  <% } %>
  <div class="card-copy">
    <p class="eyebrow"><%= project.group %></p>
    <h3 class="card-title"><a href="/projects/<%= project.slug %>/" aria-label="<%= project.title %> case study"><%= project.title %></a></h3>
    <p class="card-description"><%= project.intro %></p>
    <a class="text-link card-visit" href="<%= site.url %>" target="_blank" rel="noopener noreferrer"><%= site.label %><span class="sr-only"> (opens in a new tab)</span></a>
  </div>
</article>
