<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#18283f">
    <link rel="icon" href="/hotglobe2.ico">
    <% const opts = htmlWebpackPlugin.options; const page = opts.page; %>
    <title><%- page.title %></title>
    <meta name="description" content="<%- page.description %>">
    <meta property="og:type" content="website">
    <meta property="og:title" content="<%- page.title %>">
    <meta property="og:description" content="<%- page.description %>">
    <meta property="og:image" content="<%- opts.siteUrl %>/media/<%- page.image || 'racine-lakefront.webp' %>">
    <% if (opts.canonical) { %>
    <link rel="canonical" href="<%- opts.canonical %>">
    <meta property="og:url" content="<%- opts.canonical %>">
    <% } else { %>
    <meta name="robots" content="noindex">
    <% } %>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <main>
        <h1><%- page.heading %></h1>
        <p><%- page.description %></p>
        <% if (opts.publications.length) { %>
        <h2>Faculty publications</h2>
        <ol><% for (const paper of opts.publications) { %>
          <li><a href="https://doi.org/<%- paper.doi %>"><%- paper.title %></a><br>
            <%- paper.authors.join(', ') %>. <cite><%- paper.venue %></cite>, <%- paper.year %>, pp. <%- paper.pages %>.</li>
        <% } %></ol>
        <% } %>
        <% if (opts.conferenceReviews.length) { %>
        <section id="peer-review" aria-labelledby="peer-review-title">
          <h2 id="peer-review-title">Conference peer review</h2>
          <p>I’ve served as a paper reviewer for conferences in engineering education and computing.</p>
          <% for (const group of opts.conferenceReviews) { %>
          <h3><%- group.year %></h3>
          <ul><% for (const conference of group.conferences) { %>
            <li><a href="<%- conference.url %>" aria-label="<%- conference.name %>, <%- group.year %>"><%- conference.name %></a></li>
          <% } %></ul>
          <% } %>
        </section>
        <% } %>
        <p>Enable JavaScript to explore the galleries and classroom examples.</p>
        <nav aria-label="Portfolio"><a href="/">Home</a> · <a href="/projects">Projects</a> · <a href="/teaching">Teaching</a> · <a href="/research">Research &amp; publications</a> · <a href="/about">About</a> · <a href="/skills">Skills</a> · <a href="/contact">Contact</a></nav>
        <p><a href="<%- opts.profile.linkedIn %>">Anthony Aiello on LinkedIn</a></p>
      </main>
    </noscript>
  </body>
</html>
